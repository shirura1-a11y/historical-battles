name: Render Sekigahara
on:
  push:
    branches: [main]
    paths: ['scene.py', 'produce.py', '.github/workflows/render.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install free production tools
        run: sudo apt-get update && sudo apt-get install -y blender ffmpeg fonts-noto-cjk
      - name: Build and render 2100 frames
        run: blender -b -t 4 --python scene.py -- --render
      - name: Sound, bilingual captions and MP4
        run: python3 produce.py
      - name: Verify final media
        run: |
          python3 - <<'PY'
          import json, subprocess
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json','build/sekigahara.mp4']))
          v=next(x for x in p['streams'] if x['codec_type']=='video')
          assert (v['width'],v['height'],v['r_frame_rate'])==(720,1280,'30/1')
          assert v['codec_name']=='h264' and int(v['nb_frames'])==2100
          assert any(x['codec_type']=='audio' for x in p['streams'])
          assert abs(float(p['format']['duration'])-70)<.1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sekigahara-720x1280-30fps
          path: |
            build/sekigahara.mp4
            build/captions.ass
            AUDIO_LICENSE.md
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'release'
    needs: render
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sekigahara-720x1280-30fps
          path: artifact
      - name: Attach MP4 to published Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" artifact/build/sekigahara.mp4 --clobber
